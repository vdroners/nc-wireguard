name: Release

on:
  release:
    types: [published]

jobs:
  appstore:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction

      - name: Build App Store tarball
        run: make appstore

      - name: Write signing material
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          printf '%s' "$APP_PRIVATE_KEY" > /tmp/app.key
          printf '%s' "$APP_PUBLIC_CRT" > /tmp/app.crt
          echo "APP_PRIVATE_KEY=/tmp/app.key" >> "$GITHUB_ENV"
          echo "APP_PUBLIC_CRT=/tmp/app.crt" >> "$GITHUB_ENV"

      - name: Sign app (Nextcloud occ in container)
        run: |
          VERSION=$(grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' appinfo/info.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          STAGING="/tmp/nc_wireguard-${VERSION}"
          docker run --rm \
            -v "${STAGING}:/var/www/html/custom_apps/nc_wireguard" \
            -v /tmp/app.key:/tmp/app.key:ro \
            -v /tmp/app.crt:/tmp/app.crt:ro \
            -e APP_PRIVATE_KEY=/tmp/app.key \
            -e APP_PUBLIC_CRT=/tmp/app.crt \
            nextcloud:stable \
            bash -c 'cp /var/www/html/custom_apps/nc_wireguard/scripts/file_from_env.php /tmp/file_from_env.php && php occ integrity:sign-app --privateKey="file:///tmp/file_from_env.php" --certificate="file:///tmp/file_from_env.php" nc_wireguard'
          tar -czf "/tmp/nc_wireguard-${VERSION}.tar.gz" -C /tmp "nc_wireguard-${VERSION}"

      # Tarball name MUST match info.xml version (e.g. nc_wireguard-2.3.0.tar.gz).
      # Release tags should be the bare semver (2.3.0). If the tag is v2.3.0, we still
      # publish the asset as nc_wireguard-<info.xml version>.tar.gz and point the
      # App Store download_url at that filename.
      - name: Normalize release asset name
        id: asset
        run: |
          VERSION=$(grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' appinfo/info.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          TAG="${{ github.event.release.tag_name }}"
          TAG_STRIPPED="${TAG#v}"
          if [[ "$TAG_STRIPPED" != "$VERSION" ]]; then
            echo "::warning::Release tag '$TAG' != info.xml version '$VERSION' — asset uses info.xml version"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=/tmp/nc_wireguard-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          test -f "/tmp/nc_wireguard-${VERSION}.tar.gz"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.tarball }}

      - name: Push to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: nc_wireguard
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/nc_wireguard-${{ steps.asset.outputs.version }}.tar.gz
